[package]
name = "yoomoney"
version = "0.1.0"
edition = "2024"
description = "Async YooMoney wallet API client: OAuth, account info, history, payments, quickpay links, notifications"
license = "MIT"
repository = "https://github.com/amnesiaof/yoomoney"
keywords = ["yoomoney", "wallet", "api", "payment", "quickpay"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
url = "2"
hmac = "0.12"
sha2 = "0.10"
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
